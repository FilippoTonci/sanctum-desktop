name: Release

# One deliberate release per click: Actions -> Release -> Run workflow ->
# type a version. `prepare` does the bookkeeping (validate, bump, tag, pin
# the backend), the build jobs compile the tag, and `publish` attaches both
# the versioned artifacts and moving version-less copies that the download
# site links to. See RELEASE.md.
#
# WS6 (Phase 3) wires signing + notarization against real secrets. Those
# secret names are already referenced below so the procurement flow in
# WS2.7 can provision them up front. Nothing is signed yet.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, no leading v (e.g. 0.1.0-rc.1)'
        required: true
        type: string

# Never let two releases interleave; a half-tagged main is nasty to unpick.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that can fail cheaply happens here, before a single runner
  # spins up a 20-minute PyInstaller build.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      sanctum_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Refuse to release from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main. Got ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v4

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Semver, optionally with a prerelease and/or build suffix. A
          # leading "v" is the tag's job, not the version's.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semver version. Example: 0.1.0-rc.1 (no leading v)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Pick a new version."
            exit 1
          fi

      - name: Pin the sanctum backend to a commit
        id: pin
        run: |
          set -euo pipefail
          # The desktop artifact and the backend inside it must be a known
          # pair, not "whatever main was that morning". Resolve once, here,
          # and hand the same SHA to every build job.
          sha="$(git ls-remote https://github.com/FilippoTonci/sanctum.git refs/heads/main | cut -f1)"
          if [ -z "$sha" ]; then
            echo "::error::Could not resolve FilippoTonci/sanctum main."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned sanctum to $sha"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Bump, commit, tag
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # --no-git-tag-version: npm updates package.json AND
          # package-lock.json (which carries the version twice) but leaves
          # git alone, so the commit and tag below are ours to shape.
          npm version "$VERSION" --no-git-tag-version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare
    # Apple Silicon only — see electron-builder.yml `mac.target[].arch`.
    # Supporting Intel means adding a second job on `macos-13` (an x64
    # runner) that builds its own sidecar, because PyInstaller cannot
    # cross-compile. Both places must change together.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag, not the branch: what ships is exactly what was tagged,
          # and package.json here already carries the bumped version that
          # electron-builder stamps onto the artifacts.
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Check out the sanctum backend
        uses: actions/checkout@v4
        with:
          repository: FilippoTonci/sanctum
          ref: ${{ needs.prepare.outputs.sanctum_sha }}
          path: sanctum-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Must precede `npm run make`: sidecar-build/ is gitignored, so a
      # fresh checkout has no bundle and electron-builder would otherwise
      # ship an installer with no backend in it. beforePack now hard-fails
      # if this step is missing or produced the wrong arch.
      - name: Build the Python sidecar
        run: PYTHON=python SANCTUM_REPO=sanctum-src bash scripts/build-sidecar.sh
      - name: Build + sign + notarize (WS6)
        env:
          # Developer ID Application certificate (base64-encoded .p12).
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          # notarytool credentials.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # --publish never: electron-builder would otherwise try to upload to
        # GitHub Releases itself and abort on a missing GH_TOKEN, after the
        # whole build. The `publish` job below is the single publisher.
        run: npm run make -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sanctum-desktop-macos
          path: release/*.dmg
          retention-days: 30

  build-windows:
    needs: prepare
    # WS6: this job runs on a self-hosted runner with EV cert + YubiKey,
    # OR on a GitHub-hosted windows-latest if Azure Trusted Signing is
    # used (no hardware token required). Decision deferred to WS2.7
    # procurement outcome. Until then the job is disabled, and `publish`
    # does not wait on it.
    if: false
    runs-on: [self-hosted, Windows, signing]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Check out the sanctum backend
        uses: actions/checkout@v4
        with:
          repository: FilippoTonci/sanctum
          ref: ${{ needs.prepare.outputs.sanctum_sha }}
          path: sanctum-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # build-sidecar.sh detects MINGW/MSYS and emits win-x64; Git Bash
      # ships with the Windows runners, hence the explicit bash shell.
      - name: Build the Python sidecar
        shell: bash
        run: PYTHON=python SANCTUM_REPO=sanctum-src bash scripts/build-sidecar.sh
      - name: Build + sign (WS6)
        env:
          # Azure Trusted Signing — US/Canada entities only.
          AZURE_TRUSTED_SIGNING_CLIENT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          AZURE_TRUSTED_SIGNING_TENANT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_SECRET: ${{ secrets.AZURE_TRUSTED_SIGNING_SECRET }}
          # Sectigo/DigiCert EV + YubiKey fallback (hardware-bound, needs
          # the self-hosted runner).
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PWD }}
        run: npm run make -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sanctum-desktop-windows
          path: release/*.exe
          retention-days: 30

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Check out the sanctum backend
        uses: actions/checkout@v4
        with:
          repository: FilippoTonci/sanctum
          ref: ${{ needs.prepare.outputs.sanctum_sha }}
          path: sanctum-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The AppImage inherits this runner's glibc as its floor: built on
      # ubuntu-latest it will not start on materially older distros.
      - name: Build the Python sidecar
        run: PYTHON=python SANCTUM_REPO=sanctum-src bash scripts/build-sidecar.sh
      - name: Build + GPG sign (WS6)
        env:
          # GPG key material for AppImage + deb signatures.
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: npm run make -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sanctum-desktop-linux
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 30

  publish:
    # build-windows is `if: false`; do not wait on a job that never runs.
    needs: [prepare, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Stage the version-less copies
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p moving
          # GitHub's /releases/latest/download/<name> permalink needs an
          # asset name that never changes, so the download site can hardcode
          # its links and never be edited again. The versioned originals stay
          # attached too, so older builds remain reachable.
          stage() {
            dest="$1"
            shift
            if [ "$#" -ne 1 ]; then
              echo "::error::expected exactly one artifact for $dest, found $#: $*"
              exit 1
            fi
            cp "$1" "moving/$dest"
            echo "  $dest  <-  $(basename "$1")"
          }
          stage 'Sanctum-Desktop-arm64.dmg' dist-artifacts/sanctum-desktop-macos/*.dmg
          stage 'Sanctum-Desktop-x86_64.AppImage' dist-artifacts/sanctum-desktop-linux/*.AppImage
          stage 'sanctum-desktop-amd64.deb' dist-artifacts/sanctum-desktop-linux/*.deb

      - name: Write the release notes preamble
        env:
          SANCTUM_SHA: ${{ needs.prepare.outputs.sanctum_sha }}
        run: |
          set -euo pipefail
          {
            cat <<'MD'
          > ### Unsigned build — for developers and testers
          >
          > These installers are **not code-signed or notarized**. They are
          > published so people can run and test Sanctum Desktop before the
          > signing infrastructure exists. Your OS will object, by design.

          **macOS** (Apple Silicon only — there is no Intel build):

          ```
          xattr -dr com.apple.quarantine "/Applications/Sanctum Desktop.app"
          ```

          **Linux**: `chmod +x` the `.AppImage` before running it. On WSL2 it
          will fail on missing FUSE — extract it, or use the `.deb`.

          **Windows**: no build yet. Signing is still being procured.

          ---
          MD
            echo ""
            echo "Backend pinned to sanctum [\`$SANCTUM_SHA\`](https://github.com/FilippoTonci/sanctum/commit/$SANCTUM_SHA)."
          } > notes.md
          cat notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          # Not a draft and not flagged pre-release: both hide the release
          # from /releases/latest/download/, which is the permalink the
          # download site is built on. The "unsigned" warning does the work
          # a pre-release badge would have done — see notes.md above.
          draft: false
          prerelease: false
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/sanctum-desktop-macos/*.dmg
            dist-artifacts/sanctum-desktop-linux/*.AppImage
            dist-artifacts/sanctum-desktop-linux/*.deb
            moving/*
