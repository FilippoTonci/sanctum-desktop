name: Windows installer

# Build, install and smoke-test the Windows installer before a release
# depends on it. Nobody on the team runs Windows day to day, so this run is
# the Windows test bench: the installer it uploads is the one to try in a VM.
# Takes ~30 minutes, so it runs only for changes that can affect packaging.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/windows-installer.yml'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/main/**'
      - 'src/preload/**'
      - 'tests/package/**'
      - 'playwright.package.config.ts'
  workflow_dispatch:
    inputs:
      sanctum_ref:
        description: 'sanctum backend branch or commit to bundle'
        type: string
        default: main

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-windows.yml
    with:
      sanctum_ref: ${{ inputs.sanctum_ref || 'main' }}
    secrets: inherit
