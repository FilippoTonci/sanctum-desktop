appId: com.sanctum.desktop
productName: Sanctum Desktop
copyright: Copyright © 2026 Filippo Tonci
directories:
  output: release
  buildResources: resources
# Hard-fails when the target's sidecar bundle is absent. Without it,
# extraResources logs "file source doesn't exist" and ships a
# backend-less installer with exit 0. See scripts/before-pack.cjs.
beforePack: scripts/before-pack.cjs
files:
  - out/**/*
  - package.json
  - '!**/*.{md,map}'
# PyInstaller onedir output of the Python sidecar is built by
# `scripts/build-sidecar.sh` under `sidecar-build/<os>-<arch>/`.
# electron-builder templates `${os}` = mac/linux/win and `${arch}` =
# x64/arm64 per build target. At runtime `src/main/paths.ts` reads
# `process.resourcesPath/sidecar/sanctum-sidecar[.exe]`.
extraResources:
  - from: 'sidecar-build/${os}-${arch}'
    to: sidecar
    filter:
      - '**/*'
  - from: resources/icon.png
    to: icon.png
mac:
  target:
    - target: dmg
      # Apple Silicon only. PyInstaller cannot cross-compile, so an x64
      # DMG needs its own Intel runner building its own sidecar — see the
      # macos-13 matrix note in .github/workflows/release.yml. Add x64
      # back (here and in that workflow, together) when an Intel user
      # actually needs it.
      arch: [arm64]
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  # WS6: entitlements + notarization wired here.
win:
  target:
    - target: nsis
      arch: [x64]
  # WS6: Azure Trusted Signing or Sectigo/DigiCert EV + YubiKey wired here.
linux:
  target:
    - AppImage
    - deb
  category: Office
  # WS6: GPG signing wired here.
publish:
  provider: github
  releaseType: draft
